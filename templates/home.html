{% extends "base.html" %}

{% block title %}
    {% if title %}
        FastApi: {{ title }}
    {% else %}
        Homepage
    {% endif%}
{% endblock title %}

{% block content %}
    {% for post in posts %}
        <h1 id="{{post.id}}">{{post.title}}</h1>
        <p>{{post.content}}</p>
        <p>written by {{post.author}} on {{post.date_posted}}</p>
    {%endfor%}
{% endblock content %}
